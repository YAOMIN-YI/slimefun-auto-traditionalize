name: Build ExoticGarden 繁體中文版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 安裝 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 安裝 OpenCC
        run: sudo apt-get update && sudo apt-get install -y opencc

      - name: Clone ExoticGarden 原始碼
        run: |
          git clone https://github.com/Slimefun/ExoticGarden.git
          cd ExoticGarden
          
          # 轉換所有 Java 檔案為繁體
          find . -name "*.java" -print | while read file; do
            opencc -i "$file" -o "$file.tmp" -c s2twp.json && mv "$file.tmp" "$file"
          done

      - name: 編譯 ExoticGarden
        run: |
          cd ExoticGarden
          mvn clean package -B

      - name: 上傳結果
        uses: actions/upload-artifact@v4
        with:
          name: ExoticGarden-Traditional
          path: ExoticGarden/target/*.jar
