name: Sync, Convert, and Build ExoticGarden

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    env:
      JITPACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23
          java-package: jdk
          architecture: x64

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ⭐ 配置 Maven settings.xml 加入 JitPack 認證資訊
      - name: Configure Maven settings.xml for JitPack
        run: |
          mkdir -p ~/.m2
          echo '<settings>
  <servers>
    <server>
      <id>jitpack.io</id>
      <username>${{ github.actor }}</username>
      <password>${{ secrets.GITHUB_TOKEN }}</password>
    </server>
  </servers>
</settings>' > ~/.m2/settings.xml

      # 下載 ExoticGarden 原始碼
      - name: Clone ExoticGarden
        run: |
          git clone https://github.com/SlimefunGuguProject/ExoticGarden.git

      - name: Install OpenCC
        run: sudo apt-get update && sudo apt-get install -y opencc

      - name: Convert source files to Traditional Chinese
        run: |
          find ./ExoticGarden -path ./ExoticGarden/src/main/resources/languages -prune -o \
            -type f \( -name "*.java" -o -name "*.yml" \) -print \
            | while read file; do
                opencc -i "$file" -o "$file.tmp" -c s2twp.json && mv "$file.tmp" "$file"
              done

      - name: Replace zh-CN with zh-TW in config.yml
        run: |
          find ./ExoticGarden -name config.yml -exec sed -i 's/zh-CN/zh-TW/g' {} \;

      # ⭐ 編譯 ExoticGarden，這時會從 jitpack.io 下載 Slimefun4
      - name: Build ExoticGarden
        run: |
          cd ExoticGarden
          mvn -B package --errors

      - name: Upload ExoticGarden JAR
        uses: actions/upload-artifact@v4
        with:
          name: exoticgarden-jar
          path: ExoticGarden/target/*.jar
